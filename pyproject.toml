[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videoprompt-templates"
version = "1.0.0"
description = "100+ hand-written AI video prompt templates for 21 platforms (Sora, Kling, Runway, Veo...) — pick, search, copy. CC-BY-4.0."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VideoPrompt", email = "admin@videoprompts.tools" }]
keywords = ["ai", "video", "prompts", "prompt-engineering", "sora", "kling", "text-to-video", "video-to-prompt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://videoprompts.tools/"
Repository = "https://github.com/yangchangjiang/videoprompt-site"

[project.scripts]
vp-templates = "videoprompt_templates.cli:main"

[tool.setuptools]
packages = ["videoprompt_templates"]

[tool.setuptools.package-data]
videoprompt_templates = ["data/*.json", "data/*.md"]
